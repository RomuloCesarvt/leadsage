# O plano gratuito do Render dorme depois de 15 minutos sem visita. Este agendamento visita a cada 5 minutos.
# O GitHub pode atrasar agendamentos em horas de pico; se atrasar, o servico acorda na proxima visita e
# as sessoes do WhatsApp voltam sozinhas (ficam guardadas no banco).
name: Manter a nuvem acordada
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar o servico
        run: curl -fsS --retry 3 --retry-delay 10 -m 60 https://leadsage-nuvem.onrender.com/
