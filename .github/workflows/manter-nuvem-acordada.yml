# O plano gratis do Render adormece o servico depois de 15 min sem visita, e adormecido ele nao envia nem responde no WhatsApp.
# Este agendamento visita os servicos a cada 10 min (repositorio publico: minutos do GitHub Actions sao gratis).
# Servico fora do ar ou suspenso so gera aviso; nunca derruba nada.
name: manter-nuvem-acordada
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  visitar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar os servicos da nuvem
        run: |
          for url in https://leadsage-nuvem-b.onrender.com/ https://leadsage-nuvem.onrender.com/; do
            code=$(curl -s -o /dev/null -m 60 -w '%{http_code}' "$url" || echo "sem resposta")
            echo "$url -> $code"
          done
