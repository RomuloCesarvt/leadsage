# O plano gratuito do Render dorme depois de 15 minutos sem visita. Este agendamento visita os dois servicos a cada 5 minutos.
# O GitHub pode atrasar agendamentos em horas de pico; se atrasar, o servico acorda na proxima visita e
# as sessoes do WhatsApp voltam sozinhas (ficam guardadas no banco).
# Servico fora do ar ou suspenso so gera aviso no registro; nunca derruba nada.
name: Manter a nuvem acordada
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar os servicos
        run: |
          for url in https://leadsage-nuvem-b.onrender.com/ https://leadsage-nuvem.onrender.com/; do
            code=$(curl -s -o /dev/null -m 60 -w '%{http_code}' "$url" || echo "sem resposta")
            echo "$url -> $code"
          done
