# Exemplo para o Fly.io (fly launch --no-deploy --copy-config --dockerfile nuvem/Dockerfile).
# Troque o nome do app. O volume guarda as sessoes do WhatsApp: sem ele, cada deploy pede o QR de novo.
app = "leadsage-nuvem"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "dados"
  destination = "/dados"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
