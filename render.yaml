# Blueprint do Render para o servico "LeadSage Nuvem" (WhatsApp de cada usuario, sempre ligado).
# A sessao do WhatsApp fica no banco do LeadSage (cifrada), entao nao precisa de disco.
services:
  - type: web
    name: leadsage-nuvem
    runtime: docker
    plan: free
    dockerfilePath: ./nuvem/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: WORKER_SECRET
        sync: false
      - key: LEADSAGE_URL
        value: https://leadsageofc.vercel.app
      - key: AUTH
        value: banco
