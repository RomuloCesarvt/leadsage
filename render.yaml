services:
  - type: web
    name: leadsage-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Sem esta chave a busca de leads falha com "Chave da API do
      # Google Maps ausente" — faltava na configuracao do Render.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: PORT
        value: 8000
